# Keeps the experiment running: renews the owner's EVM window, refills the control
# vault after it has been robbed, and now and then proves the hybrid vault pays its owner.
# Needs two repository secrets: VAULT_MNEMONIC and DEPLOYER_MNEMONIC. Testnet accounts only.
# For the Q-Day drill, set the repository variable KEEPER_MODE to "drill"; set it back to "normal" after.
name: keeper

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run keeper
        env:
          VAULT_MNEMONIC: ${{ secrets.VAULT_MNEMONIC }}
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
          KEEPER_MODE: ${{ vars.KEEPER_MODE }}
